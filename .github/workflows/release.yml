name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build icon
        run: python -c "import crash_flow as m; m.make_icon(m.STATE_COLORS['idle'], 256).save('icon.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])"

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name CrashFlow --icon icon.ico --hidden-import pystray._win32 --exclude-module platform_mac crash_flow.py

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/CrashFlow.exe
            dist/CrashFlow-Setup.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1 and newer)
            name: macos
            zip: CrashFlow-mac.zip
          - runner: macos-15-intel    # Intel Macs
            name: macos-intel
            zip: CrashFlow-mac-intel.zip
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test (pill on screen)
        run: python tests/smoke_pill.py . pill-${{ matrix.name }}.png

      - name: Build app
        run: |
          uname -m
          python -c "import crash_flow as m; m.make_icon(m.STATE_COLORS['idle'], 512).save('icon.png')"
          pyinstaller --noconfirm --windowed --name CrashFlow --icon icon.png \
            --osx-bundle-identifier com.thecrasho.myanmarflow \
            --hidden-import pystray._darwin --exclude-module platform_win crash_flow.py
          version="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = "tag" ] || version="0.0.0"
          plist=dist/CrashFlow.app/Contents/Info.plist
          setkey() {  # set a key, adding it if PyInstaller didn't
            /usr/libexec/PlistBuddy -c "Set :$1 $3" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$plist"
          }
          setkey CFBundleShortVersionString string "$version"
          setkey CFBundleDisplayName string "'Crash Flow'"
          setkey LSUIElement bool true
          setkey NSMicrophoneUsageDescription string "'Crash Flow listens while you hold the hotkey and turns your speech into text.'"
          # Editing Info.plist breaks PyInstaller's ad-hoc signature; Apple Silicon won't run unsigned code.
          codesign --force --deep --sign - dist/CrashFlow.app
          file dist/CrashFlow.app/Contents/MacOS/CrashFlow
          ditto -c -k --keepParent dist/CrashFlow.app "dist/${{ matrix.zip }}"

      - name: Smoke test (built app starts)
        run: |
          dist/CrashFlow.app/Contents/MacOS/CrashFlow &
          pid=$!
          sleep 12
          log="$HOME/Library/Application Support/CrashFlow/crash_flow.log"
          cat "$log" || true
          kill -0 $pid   # still running
          kill $pid
          ! grep -q "Fatal error" "$log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.zip }}
            pill-${{ matrix.name }}*.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/CrashFlow-Setup.exe
            windows/CrashFlow.exe
            macos/dist/CrashFlow-mac.zip
            macos-intel/dist/CrashFlow-mac-intel.zip
          body: |
            ## Download

            - **CrashFlow-Setup.exe** — Windows မှာ ထည့်သွင်းရန် (အကြံပြု) / Windows installer (recommended)
            - **CrashFlow.exe** — Windows မှာ Install မလုပ်ဘဲ တိုက်ရိုက်ဖွင့်ရန် / Windows portable
            - **CrashFlow-mac.zip** — Mac (M1, M2, M3, M4 ...) အတွက် / macOS, Apple Silicon
            - **CrashFlow-mac-intel.zip** — Intel Mac အတွက် / macOS, Intel

            ## ပထမဆုံးဖွင့်တဲ့အခါ သတိပေးစာ ပေါ်ရင် / A warning on first launch

            🛡️ **သတိပေးချက်ပဲဖြစ်ပြီး ဘာမှ မဖြစ်စေပါဘူး။** Apple နဲ့ Microsoft ကို ပိုက်ဆံပေးပြီး လက်မှတ်မထိုးထားတဲ့ app တိုင်းမှာ ပေါ်တာပါ၊ virus တွေ့လို့ ပြတာ မဟုတ်ပါဘူး။ ဒီ file တွေကို repo ထဲက code ကနေ GitHub Actions ပေါ်မှာ တိုက်ရိုက် build လုပ်ထားတာပါ။ တစ်ခါပဲ ခွင့်ပြုရပါတယ်။

            **It's only a warning and does no harm.** The app isn't paid-signed by Microsoft or notarized by Apple, so every first launch of an unsigned app shows it; nothing was found in the app. These files are built from this repo's code on GitHub Actions. You only allow it once.

            - **Windows** — အပြာရောင် box ပေါ်ရင် **More info → Run anyway** / Blue box: **More info → Run anyway**
            - **Mac** — "Apple could not verify…" ပေါ်ရင် **Move to Trash** မနှိပ်ဘဲ **Done** → **System Settings → Privacy & Security → Open Anyway** → password ထည့်ပြီး **Open** / Click **Done** (not Move to Trash), then **System Settings → Privacy & Security → Open Anyway**, then **Open**

            Mac ဖွင့်နည်း အသေးစိတ် / Mac steps: https://crashflow.thecrasho.com/#mac

            Setup လမ်းညွှန်: https://github.com/ThecrashO/crash-flow#readme
