name: Mac code test

# Runs the app's code-mode calls (Live, batch, clean-up) on real Macs against the
# live code server. Started by hand, because each run uses about 23 s of the test code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 1   # both use the same code; one at a time keeps each charge check exact
      matrix:
        runner: [macos-latest, macos-15-intel]   # Apple Silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Use the app with a code
        env:
          MF_TEST_CODE: ${{ secrets.MF_TEST_CODE }}
        run: python server/tests/code_test.py
