name = "myanmar-flow"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Always run in Singapore, never at the edge closest to the user. Gemini refuses calls
# from Myanmar, and Cloudflare would otherwise run a Myanmar user's request in or near Myanmar.
[placement]
mode = "targeted"
region = "gcp:asia-southeast1"

# Secrets (never put them in this file):
#   npx wrangler secret put GEMINI_API_KEY   your paid Gemini API key
#   npx wrangler secret put ADMIN_TOKEN      a long random password for the admin page

[[d1_databases]]
binding = "DB"
database_name = "myanmar-flow"
database_id = "78dbb0a2-8653-4238-b9d0-624e3b36b164"

# Served at the owner's own domain (thecrasho.com is on this Cloudflare account).
# The app was called Myanmar Flow until 1.4. Its Worker and database keep that name (the
# secrets live on the Worker), and its old address stays on for copies of the app before 1.4.
[[routes]]
pattern = "crashflow.thecrasho.com"
custom_domain = true

[[routes]]
pattern = "myanmar-flow.thecrasho.com"
custom_domain = true
